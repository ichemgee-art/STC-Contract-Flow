name: Build check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "build-check-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "build-check.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "build-check"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "build-check.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:buildcheck"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-fund

      - name: Persist generated lockfile on audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'security/audit-hardening-2026-10-11'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/package-lock.json?ref=${HEAD_REF}" >/dev/null 2>&1; then
            exit 0
          fi
          gh api --method PUT "repos/${{ github.repository }}/contents/package-lock.json" \
            -f message="Lock audited dependencies" \
            -f branch="${HEAD_REF}" \
            -f content="$(base64 -w0 package-lock.json)"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run security:audit

      - name: Build
        run: npm run build
