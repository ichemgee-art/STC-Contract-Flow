name: Build check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "build-check-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "build-check.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "build-check"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "build-check.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:buildcheck"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run security:audit

      - name: Build
        run: npm run build
